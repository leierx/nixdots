# qs-test's sound server: no hardware, null outputs and test-tone microphones that keep volumes and links as real ones do.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    link.max-buffers = 16
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
    videotestsrc = videotestsrc/libspa-videotestsrc
    audiotestsrc = audiotestsrc/libspa-audiotestsrc
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]
context.objects = [
    { factory = spa-node-factory
        args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 200000 }
    }
    { factory = adapter
        args = { factory.name = support.null-audio-sink node.name = test-speakers node.description = Speakers media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true priority.session = 1000 }
    }
    { factory = adapter
        args = { factory.name = support.null-audio-sink node.name = test-headphones node.description = Headphones media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true priority.session = 900 }
    }
    { factory = adapter
        args = { factory.name = support.null-audio-sink node.name = test-hdmi node.description = "HDMI / DisplayPort" media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true priority.session = 800 }
    }
    { factory = adapter
        args = { factory.name = audiotestsrc node.name = test-mic node.description = Microphone media.class = Audio/Source audio.position = [ FL FR ] priority.session = 1000 }
    }
    { factory = adapter
        args = { factory.name = audiotestsrc node.name = test-headset-mic node.description = "Headset Microphone" media.class = Audio/Source audio.position = [ FL FR ] priority.session = 900 }
    }
    { factory = adapter
        args = { factory.name = support.null-audio-sink node.name = test-virtual-mic node.description = "Noise Cancelling" media.class = Audio/Source/Virtual audio.position = [ MONO ] priority.session = 100 }
    }
]
